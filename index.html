<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080c14" id="theme-color-meta" />
    <meta name="description" content="Fotorutas - Sobreimpresiona tus tracks GPX y FIT en tus mejores fotos para redes sociales con perfiles de altitud, métricas y diseño personalizable." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <title>Fotorutas - Overlays para tus rutas ciclistas y de montaña</title>
    <script>
      // Apply dark or light theme based on device settings or localStorage
      (function() {
        const stored = localStorage.getItem('fotorutas-theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = stored ? stored === 'dark' : systemDark;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.getElementById('theme-color-meta')?.setAttribute('content', '#080c14');
        } else {
          document.documentElement.classList.remove('dark');
          document.getElementById('theme-color-meta')?.setAttribute('content', '#f8fafc');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased overflow-x-hidden selection:bg-orange-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
